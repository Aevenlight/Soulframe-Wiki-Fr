name: Ancêtre du jour

on:
  schedule:
    - cron: "00 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ancestor-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node bot-ancestor/bot.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Sauvegarder l'id du message Discord
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot-ancestor/state.json
          git diff --cached --quiet || git commit -m "chore: update ancestor message id"
          git push
