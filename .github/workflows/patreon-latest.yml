name: Dernier post Patreon
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: patreon-latest
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: node patreon-latest/update.js
      - name: Sauvegarder latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patreon-latest/latest.json
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "chore: update latest Patreon post"
            git pull --rebase --autostash
            git push
          fi
